<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Стиралки Общежития</title>
<style>
  :root {
    --primary:#4f46e5; --primary-hover:#4338ca;
    --bg:#f8fafc; --card:#fff; --text:#0f172a; --text-secondary:#64748b;
    --border:#e2e8f0; --input-bg:#f8fafc;
    --free-bg:#f0fdf4; --free-text:#15803d; --free-border:#86efac;
    --busy-bg:#fef2f2; --busy-text:#b91c1c; --busy-border:#fca5a5;
    --active-bg:#dcfce7; --active-text:#166534; --active-border:#4ade80;
    --past-bg:#f1f5f9; --past-text:#94a3b8;
    --warn-bg:#fffbeb; --warn-text:#b45309; --warn-border:#fcd34d;
    --broken-bg:#fef2f2; --broken-text:#991b1b; --broken-border:#fca5a5;
    --admin-bg:#fef3c7; --admin-text:#92400e; --admin-border:#fcd34d;
    --limit-bg:#fef3c7; --limit-text:#92400e; --limit-border:#fcd34d;
  }
  body.dark {
    --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --text-secondary:#94a3b8;
    --border:#334155; --input-bg:#334155;
    --free-bg:#064e3b; --free-text:#6ee7b7; --free-border:#059669;
    --busy-bg:#7f1d1d; --busy-text:#fca5a5; --busy-border:#dc2626;
    --active-bg:#14532d; --active-text:#86efac; --active-border:#22c55e;
    --past-bg:#334155; --past-text:#64748b;
    --warn-bg:#422006; --warn-text:#fcd34d; --warn-border:#d97706;
    --broken-bg:#450a0a; --broken-text:#fca5a5; --broken-border:#dc2626;
    --admin-bg:#451a03; --admin-text:#fcd34d; --admin-border:#d97706;
    --limit-bg:#451a03; --limit-text:#fcd34d; --limit-border:#d97706;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:40px; transition:background .3s,color .3s; }
  .header { background:var(--card); border-bottom:1px solid var(--border); padding:12px 16px; position:sticky; top:0; z-index:50; }
  .header-inner { max-width:800px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-icon { font-size:28px; }
  .logo-text h1 { font-size:18px; font-weight:700; }
  .logo-text p { font-size:12px; color:var(--text-secondary); }
  .header-controls { display:flex; align-items:center; gap:8px; }
  .lang-select,.admin-btn { padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); font-size:13px; font-weight:600; cursor:pointer; }
  .admin-btn.active { background:var(--admin-bg); color:var(--admin-text); border-color:var(--admin-border); }
  .theme-toggle { width:36px; height:36px; border-radius:8px; border:1px solid var(--border); background:var(--input-bg); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .view-toggle { display:flex; gap:4px; background:var(--input-bg); padding:4px; border-radius:10px; width:100%; margin-top:8px; flex-wrap:wrap; }
  .view-btn { flex:1; min-width:84px; padding:8px 10px; border-radius:8px; border:none; background:transparent; font-size:13px; font-weight:600; color:var(--text-secondary); cursor:pointer; }
  .view-btn.active { background:var(--card); color:var(--primary); box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .container { max-width:800px; margin:0 auto; padding:16px; }
  .date-selector { display:flex; align-items:center; gap:12px; margin-bottom:16px; background:var(--card); padding:12px 16px; border-radius:12px; border:1px solid var(--border); flex-wrap:wrap; }
  .date-selector label { font-size:14px; font-weight:600; color:var(--text-secondary); }
  .date-selector input { padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:var(--input-bg); color:var(--text); }
  .rules-hint { background:var(--warn-bg); color:var(--warn-text); padding:10px 14px; border-radius:10px; font-size:13px; text-align:center; margin-bottom:16px; border:1px solid var(--warn-border); line-height:1.4; }
  .next-slot { background:var(--primary); color:#fff; padding:12px 16px; border-radius:12px; font-size:14px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:10px; box-shadow:0 4px 12px rgba(79,70,229,.25); }
  .next-slot .ns-icon { font-size:22px; }
  .next-slot .ns-sub { font-weight:400; opacity:.85; font-size:12px; }
  .verified-banner { background:var(--active-bg); color:var(--active-text); border:1px solid var(--active-border); padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .verified-banner .vb-who { font-weight:700; }
  .verified-banner button { margin-left:auto; background:transparent; border:1px solid var(--active-border); color:var(--active-text); border-radius:6px; padding:3px 8px; font-size:11px; font-weight:600; cursor:pointer; }
  .limit-info { padding:10px 14px; border-radius:10px; font-size:13px; text-align:center; margin-bottom:12px; border:1px solid var(--limit-border); background:var(--limit-bg); color:var(--limit-text); font-weight:600; }
  .machines-list { display:grid; gap:16px; }
  .machine-card { background:var(--card); border-radius:16px; padding:20px; border:2px solid var(--border); transition:all .3s; }
  .machine-card.broken { background:var(--broken-bg); border-color:var(--broken-border); opacity:.85; }
  .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:8px; flex-wrap:wrap; }
  .machine-info { display:flex; gap:12px; align-items:center; }
  .machine-icon { font-size:32px; }
  .machine-name { font-size:18px; font-weight:700; }
  .machine-floor { font-size:13px; color:var(--text-secondary); }
  .status-badge { padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700; text-transform:uppercase; }
  .status-badge.working { background:var(--free-bg); color:var(--free-text); }
  .status-badge.broken { background:var(--broken-bg); color:var(--broken-text); }
  .broken-notice { background:var(--broken-bg); border:1px solid var(--broken-border); border-radius:12px; padding:12px; margin-bottom:14px; color:var(--broken-text); font-size:14px; }
  .broken-notice strong { display:block; margin-bottom:4px; }
  .tlbar-wrap { margin-bottom:14px; }
  .tlbar-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--text-secondary); margin-bottom:4px; font-variant-numeric:tabular-nums; }
  .tlbar { position:relative; height:26px; background:var(--free-bg); border:1px solid var(--free-border); border-radius:8px; overflow:hidden; }
  .tlbar-now { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--primary); z-index:5; box-shadow:0 0 0 1px rgba(255,255,255,.6); }
  .tlbar-now::after { content:''; position:absolute; top:-3px; left:-3px; width:8px; height:8px; border-radius:50%; background:var(--primary); }
  .tlbar-seg { position:absolute; top:2px; bottom:2px; border-radius:5px; font-size:9px; font-weight:700; color:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; white-space:nowrap; padding:0 3px; }
  .tlbar-seg.s-active { background:var(--active-text); }
  .tlbar-seg.s-future { background:var(--busy-text); }
  .tlbar-seg.s-past { background:var(--past-text); opacity:.6; }
  .timeline { background:var(--input-bg); border-radius:12px; padding:12px; margin-bottom:14px; max-height:200px; overflow-y:auto; }
  .timeline-title { font-size:12px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; margin-bottom:8px; }
  .timeline-item { display:flex; align-items:center; padding:8px; border-radius:8px; margin-bottom:6px; font-size:14px; gap:8px; flex-wrap:wrap; }
  .timeline-item:last-child { margin-bottom:0; }
  .timeline-item.status-active { background:var(--active-bg); border:1px solid var(--active-border); }
  .timeline-item.status-past { background:var(--past-bg); opacity:.7; }
  .timeline-item.status-future { background:var(--card); border:1px solid var(--border); }
  .tl-time { font-weight:700; min-width:110px; font-variant-numeric:tabular-nums; }
  .tl-name { flex:1; font-weight:500; min-width:80px; }
  .tl-countdown { font-size:11px; font-weight:700; color:var(--active-text); background:var(--active-bg); padding:2px 8px; border-radius:12px; white-space:nowrap; }
  .tl-status { font-size:11px; font-weight:700; padding:2px 8px; border-radius:12px; white-space:nowrap; }
  .status-active .tl-status { background:var(--active-text); color:var(--active-bg); }
  .status-past .tl-status { background:var(--past-text); color:var(--past-bg); }
  .status-future .tl-status { background:var(--primary); color:white; }
  .btn-cancel-small { background:var(--busy-bg); color:var(--busy-text); border:1px solid var(--busy-border); padding:4px 10px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; }
  .btn-book { width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; }
  .btn-book:disabled { background:var(--past-bg); color:var(--past-text); cursor:not-allowed; }
  .schedule-container { background:var(--card); border-radius:16px; border:1px solid var(--border); overflow:hidden; margin-bottom:20px; }
  .schedule-scroll { overflow:auto; max-height:600px; }
  .schedule-table { width:100%; min-width:500px; border-collapse:collapse; }
  .schedule-table th { padding:10px 4px; text-align:center; font-size:12px; font-weight:600; color:var(--text-secondary); background:var(--input-bg); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
  .schedule-table th .th-icon { font-size:20px; display:block; margin-bottom:2px; }
  .schedule-table th.time-head { left:0; z-index:11; }
  .schedule-table td { padding:2px; text-align:center; border-bottom:1px solid var(--border); }
  .schedule-table td.time-cell { position:sticky; left:0; background:var(--card); z-index:5; }
  .time-cell { font-size:11px; font-weight:600; color:var(--text-secondary); text-align:right; padding-right:8px; white-space:nowrap; width:50px; }
  .slot-btn { width:100%; height:28px; border-radius:6px; border:none; font-size:10px; font-weight:600; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; }
  .slot-btn.free { background:var(--free-bg); color:var(--free-text); border:1px solid var(--free-border); }
  .slot-btn.disabled { background:var(--past-bg); color:var(--past-text); cursor:not-allowed; border:1px solid var(--border); }
  .slot-btn.broken { background:var(--broken-bg); color:var(--broken-text); border:1px solid var(--broken-border); cursor:not-allowed; }
  .slot-btn.booked-active { background:var(--active-bg); color:var(--active-text); border:1px solid var(--active-border); animation:pulse 2s infinite; }
  .slot-btn.booked-future { background:var(--busy-bg); color:var(--busy-text); border:1px solid var(--busy-border); }
  .slot-btn.booked-past { background:var(--past-bg); color:var(--past-text); border:1px solid var(--border); opacity:.6; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); z-index:1000; align-items:flex-end; justify-content:center; }
  .modal-overlay.active { display:flex; }
  @media (min-width:640px){ .modal-overlay{align-items:center} }
  .modal { background:var(--card); border-radius:20px 20px 0 0; padding:24px; width:100%; max-width:420px; animation:slideUp .3s ease; border:1px solid var(--border); max-height:90vh; overflow-y:auto; }
  @media (min-width:640px){ .modal{border-radius:20px} }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .modal-title h3 { font-size:18px; font-weight:700; }
  .modal-title p { font-size:13px; color:var(--text-secondary); margin-top:2px; }
  .modal-close { background:none; border:none; font-size:28px; color:var(--text-secondary); cursor:pointer; }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
  .form-group input,.form-group select,.form-group textarea { width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:10px; font-size:15px; background:var(--input-bg); color:var(--text); }
  .pin-input { font-size:24px !important; letter-spacing:10px; text-align:center; font-weight:700; }
  .pin-error { color:var(--busy-text); font-size:13px; font-weight:600; text-align:center; margin-bottom:10px; min-height:18px; }
  .pin-with-gen { display:flex; gap:8px; align-items:stretch; }
  .pin-with-gen input { flex:1; }
  .btn-gen { flex:0 0 auto; padding:0 14px; font-size:18px; border:1px solid var(--border); border-radius:10px; background:var(--input-bg); cursor:pointer; color:var(--text); line-height:1; }
  .btn-gen:active { background:var(--past-bg); }
  .quick-title { font-size:12px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; margin-bottom:8px; }
  .quick-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px; }
  .quick-btn { padding:8px 4px; border:1px solid var(--free-border); border-radius:8px; background:var(--free-bg); color:var(--free-text); font-size:12px; font-weight:700; cursor:pointer; text-align:center; line-height:1.2; }
  .quick-btn.now { background:var(--primary); color:#fff; border-color:var(--primary); }
  .quick-btn small { display:block; font-size:9px; font-weight:600; opacity:.85; }
  .free-window { font-size:13px; font-weight:600; padding:8px 12px; border-radius:8px; margin-bottom:12px; background:var(--input-bg); color:var(--text); border:1px solid var(--border); }
  .free-window.bad { background:var(--busy-bg); color:var(--busy-text); border-color:var(--busy-border); }
  .free-window.empty { background:var(--past-bg); color:var(--past-text); }
  .duration-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .duration-btn { padding:10px; border:1px solid var(--border); border-radius:10px; background:var(--input-bg); font-size:14px; font-weight:600; color:var(--text); cursor:pointer; }
  .duration-btn.active { background:var(--primary); color:white; border-color:var(--primary); }
  .summary-box { border-radius:12px; padding:12px; margin-bottom:12px; font-size:14px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); }
  .summary-box.ok { background:#eef2ff; border-color:#c7d2fe; color:#3730a3; }
  .summary-box.bad { background:var(--busy-bg); border-color:var(--busy-border); color:var(--busy-text); font-weight:600; }
  body.dark .summary-box.ok { background:#312e81; border-color:#4338ca; color:#c7d2fe; }
  .btn-submit { width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; margin-top:6px; }
  .btn-submit:disabled { background:var(--past-bg); color:var(--past-text); cursor:not-allowed; }
  .settings-panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:20px; }
  .settings-panel h3 { font-size:16px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .settings-panel h4 { font-size:14px; font-weight:700; color:var(--text-secondary); margin:18px 0 10px; text-transform:uppercase; letter-spacing:.4px; }
  .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px){ .settings-grid{grid-template-columns:1fr} }
  .setting-item label { display:block; font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
  .setting-item input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--input-bg); color:var(--text); font-size:15px; }
  .setting-hint { font-size:11px; color:var(--text-secondary); margin-top:4px; }
  .settings-actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .btn-save { flex:1; min-width:140px; padding:12px; background:var(--primary); color:white; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-reset { padding:12px 16px; background:var(--past-bg); color:var(--text); border:1px solid var(--border); border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--active-bg); color:var(--active-text); border:1px solid var(--active-border); padding:12px 20px; border-radius:12px; font-size:14px; font-weight:600; z-index:2000; display:none; box-shadow:0 4px 12px rgba(0,0,0,.15); }
  .toast.show { display:block; animation:slideUp .3s ease; }
  .machine-mgmt { display:grid; gap:10px; }
  .machine-mgmt-row { display:grid; grid-template-columns:auto 1fr 1fr auto auto auto; gap:8px; align-items:center; background:var(--input-bg); border:1px solid var(--border); border-radius:10px; padding:8px 10px; }
  .machine-mgmt-row input[type=text] { padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--text); font-size:14px; }
  .machine-mgmt-row .mm-id { font-size:12px; font-weight:700; color:var(--text-secondary); min-width:28px; }
  .mm-toggle { font-size:12px; font-weight:600; padding:6px 10px; border-radius:6px; border:1px solid var(--border); cursor:pointer; background:var(--card); color:var(--text); white-space:nowrap; }
  .mm-toggle.on { background:var(--free-bg); color:var(--free-text); border-color:var(--free-border); }
  .mm-del { background:var(--busy-bg); color:var(--busy-text); border:1px solid var(--busy-border); padding:6px 10px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; }
  .add-machine-bar { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .add-machine-bar input { flex:1; min-width:120px; padding:9px 12px; border:1px solid var(--border); border-radius:8px; background:var(--input-bg); color:var(--text); font-size:14px; }
  .list-toolbar { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:14px; display:grid; gap:12px; }
  .list-search-row { display:flex; gap:8px; }
  .list-search { flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:10px; background:var(--input-bg); color:var(--text); font-size:15px; }
  .list-sort { padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--input-bg); color:var(--text); font-size:14px; }
  .alpha-index { display:flex; flex-wrap:wrap; gap:4px; }
  .alpha-btn { min-width:30px; padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:var(--input-bg); color:var(--text-secondary); font-size:13px; font-weight:600; cursor:pointer; }
  .alpha-btn.active { background:var(--primary); color:white; border-color:var(--primary); }
  .alpha-btn.empty { opacity:.35; cursor:default; }
  .list-stats { font-size:12px; color:var(--text-secondary); text-align:center; }
  .add-user-bar { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; }
  @media (max-width:520px){ .add-user-bar{grid-template-columns:1fr 1fr} }
  .add-user-bar input { padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--input-bg); color:var(--text); font-size:14px; }
  .btn-add-user { padding:10px 16px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .users-scroll { background:var(--card); border:1px solid var(--border); border-radius:14px; max-height:60vh; overflow-y:auto; }
  .letter-header { position:sticky; top:0; background:var(--input-bg); color:var(--primary); font-weight:700; font-size:13px; padding:6px 14px; border-bottom:1px solid var(--border); z-index:2; }
  .user-row { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); gap:10px; }
  .user-row:last-child { border-bottom:none; }
  .user-name { font-size:15px; font-weight:500; }
  .user-meta { font-size:11px; color:var(--text-secondary); }
  .bind-chip { display:inline-block; font-size:10px; font-weight:700; padding:1px 6px; border-radius:8px; margin-left:6px; vertical-align:middle; }
  .bind-chip.ok { background:var(--free-bg); color:var(--free-text); }
  .bind-chip.warn { background:var(--busy-bg); color:var(--busy-text); }
  .user-actions { display:flex; gap:6px; }
  .btn-mini { padding:5px 9px; border-radius:6px; font-size:11px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--input-bg); color:var(--text); white-space:nowrap; }
  .btn-mini.danger { background:var(--busy-bg); color:var(--busy-text); border-color:var(--busy-border); }
  .empty-list { text-align:center; color:var(--text-secondary); padding:30px; font-style:italic; }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">🧺</span>
      <div class="logo-text">
        <h1 id="appTitle">Стиралки</h1>
        <p id="appSubtitle">Бронирование в общежитии</p>
      </div>
    </div>
    <div class="header-controls">
      <select id="langSelect" class="lang-select" onchange="setLanguage(this.value)">
        <option value="ru">RU</option>

  async function sha256(str){
    if (!window.crypto || !crypto.subtle) throw new Error('INSECURE_CONTEXT');
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(str)));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  // ===== УНИКАЛЬНОСТЬ / СЛОЖНОСТЬ PIN =====
  function findDuplicatePinHash(excludeUid, hash){
    for (const [uid,u] of Object.entries(allowedUsers)){
      if (excludeUid && uid===excludeUid) continue;
      if (u.pinHash && u.pinHash===hash) return u;
    }
    return null;
  }
  function isWeakPin(pin){
    if (/^(\d)\1{5}$/.test(pin)) return true;
    const seq='0123456789';
    for (let i=0;i<=4;i++){
      const asc=seq.slice(i,i+6), desc=[...asc].reverse().join('');
      if (pin===asc || pin===desc) return true;
    }
    return false;
  }
  function randomPin(){
    let p; do { p=String(Math.floor(100000+Math.random()*900000)); } while (isWeakPin(p));
    return p;
  }
  window.genPinInto = async (id)=>{
    const el=document.getElementById(id); if(!el) return;
    let pin, hash, tries=0;
    do {
      pin=randomPin();
      try { hash=await sha256(pin); }
      catch { el.value=pin; return; }
      tries++;
    } while (findDuplicatePinHash(null, hash) && tries<25);

    open: config.openHour, close: config.closeHour, advance: config.maxAdvanceHours,
    dailyMachines: config.dailyMachinesLimit,
    perMachineH: +(config.perMachineDailyLimit/60).toFixed(1),

  });

  const showToast = (msg) => {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>el.classList.remove('show'), 2500);

  let isDark = localStorage.getItem('laundry_dark') === 'true';
  function applyTheme() {
    document.body.classList.toggle('dark', isDark);
    document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
  }
  window.toggleTheme = () => { isDark=!isDark; localStorage.setItem('laundry_dark',isDark); applyTheme(); };
  applyTheme();

  let bookings={}, machineStatuses={}, allowedUsers={};
  let machinesList=[]; let machinesLoaded=false;
  let currentView='machines';
  let selectedDate = new Date().toISOString().split('T')[0];
  let pendingBooking=null, selectedDuration=60;
  let usersSearch='', usersLetter='', usersSort='lastNameAsc';

  function getSession(){ try{ return JSON.parse(localStorage.getItem('laundry_pin_session')||'null'); }catch{ return null; } }
  function hasActiveSession(nameKey){ const s=getSession(); return !!(s && s.nameKey===nameKey && s.exp>Date.now()); }
  function setSession(nameKey,pinHash){ localStorage.setItem('laundry_pin_session', JSON.stringify({nameKey,pinHash,exp:Date.now()+PIN_SESSION_HOURS*3600*1000})); }
  function clearSession(){ localStorage.removeItem('laundry_pin_session'); }
  function getLastIdentity(){ try{ return JSON.parse(localStorage.getItem('laundry_last_identity')||'null'); }catch{ return null; } }
  function setLastIdentity(nameKey,ln,fn){ localStorage.setItem('laundry_last_identity', JSON.stringify({nameKey,lastName:ln,firstName:fn})); }
  function clearLastIdentity(){ localStorage.removeItem('laundry_last_identity'); }

  const nameKey = (ln,fn)=> `${ln} ${fn}`.trim().toLowerCase().replace(/\s+/g,'_').replace(/[.#$\[\]/]/g,'');
  const bookingNameKey = (b)=> b.nameKey || nameKey(b.lastName, b.firstName);
  const findAllowedByNameKey = (nk)=> Object.values(allowedUsers).find(u=>nameKey(u.lastName,u.firstName)===nk);

  const timeToMinutes = (tm)=>{const[h,m]=tm.split(':').map(Number);return h*60+m;};
  const minutesToTime = (mn)=>`${String(Math.floor(mn/60)).padStart(2,'0')}:${String(mn%60).padStart(2,'0')}`;
  const addMinutes = (tm,mn)=>minutesToTime(timeToMinutes(tm)+mn);
  const closingMinutes = ()=>config.closeHour*60;
  const openingMinutes = ()=>config.openHour*60;

  // ★ ПРАВКА 1: учитываем выбранную дату (будущий день -> с открытия)
  function getDefaultStartTime(dateStr){
    const todayStr = new Date().toISOString().split('T')[0];
    if (dateStr && dateStr > todayStr) return minutesToTime(openingMinutes());
    const now=new Date();
    let m = now.getHours()*60+now.getMinutes();
    m = Math.ceil(m/5)*5;
    m = Math.max(m, openingMinutes());
    m = Math.min(m, closingMinutes()-30);
    return minutesToTime(m);
  }

  const getTimeSlots = () => {
    const slots=[];
    for (let h=config.openHour; h<config.closeHour; h++){
      slots.push(`${String(h).padStart(2,'0')}:00`);
      slots.push(`${String(h).padStart(2,'0')}:30`);
    }
    return slots;
  };

  const getWeekStart = () => {
    const now=new Date(); const day=now.getDay();
    const diff=now.getDate()-day+(day===0?-6:1);
    const mon=new Date(now.setDate(diff)); mon.setHours(0,0,0,0); return mon;
  };
  const getWeeklyUsage = (nk) => {
    const ws=getWeekStart(); let total=0;
    for (const b of Object.values(bookings)){
      if (bookingNameKey(b)!==nk) continue;
      const[y,m,d]=b.date.split('-').map(Number);
      if (new Date(y,m-1,d)>=ws) total+=(b.duration||0);
    }
    return total;
  };

  const isUserAllowed = (ln,fn) => {
    const full=`${ln} ${fn}`.trim().toLowerCase();
    return Object.values(allowedUsers).some(u=>(u.fullName||'').toLowerCase()===full);
  };

  const isSlotAllowed = (dateStr,timeStr) => {
    const[y,m,d]=dateStr.split('-').map(Number);
    const[h,min]=timeStr.split(':').map(Number);
    const slot=new Date(y,m-1,d,h,min);
    if (slot<new Date()) return false;
    if (slot>new Date(Date.now()+config.maxAdvanceHours*3600*1000)) return false;
    if (h*60+min < openingMinutes()) return false;
    return true;
  };
  const canFinishByClosing = (timeStr,dur)=> (timeToMinutes(timeStr)+dur) <= closingMinutes();

  const getBookingStatus = (b)=>{
    const now=new Date();
    const[y,m,d]=b.date.split('-').map(Number);
    const[sh,sm]=b.startTime.split(':').map(Number);
    const[eh,em]=b.endTime.split(':').map(Number);
    const start=new Date(y,m-1,d,sh,sm), end=new Date(y,m-1,d,eh,em);
    if (now>=end) return 'past';
    if (now>=start&&now<end) return 'active';
    return 'future';
  };
  const minutesLeft = (b)=>{
    const now=new Date();
    const[y,m,d]=b.date.split('-').map(Number);
    const[eh,em]=b.endTime.split(':').map(Number);
    const end=new Date(y,m-1,d,eh,em);
    return Math.max(0, Math.round((end-now)/60000));
  };
  const isSlotAvailable = (mid,date,st,et)=>{
    const ns=timeToMinutes(st), ne=timeToMinutes(et);
    for (const b of Object.values(bookings))
      if (b.machineId===mid&&b.date===date&& ns<timeToMinutes(b.endTime)&&ne>timeToMinutes(b.startTime)) return false;
    return true;
  };
  const formatDate = (ds)=>{
    const d=new Date(ds+'T00:00:00');
    const loc={ru:'ru-RU',en:'en-US',zh:'zh-CN'};
    return d.toLocaleDateString(loc[currentLang],{weekday:'short',day:'numeric',month:'long'});
  };

  const getFreeUntil = (mid,date,startTime)=>{
    const s=timeToMinutes(startTime);
    let until=closingMinutes();
    for (const b of Object.values(bookings)){
      if (b.machineId!==mid||b.date!==date) continue;
      const bs=timeToMinutes(b.startTime);
      if (bs>=s && bs<until) until=bs;
    }
    return minutesToTime(until);
  };
  const getMaxFit = (mid,date,startTime)=>{
    const s=timeToMinutes(startTime);
    const u=timeToMinutes(getFreeUntil(mid,date,startTime));
    return Math.max(0, u-s);
  };
  // ★ ПРАВКА 2: старт быстрых слотов от выбранной даты
  const getNearestFreeSlots = (mid,date,n=4)=>{
    const res=[];
    const startMin=timeToMinutes(getDefaultStartTime(date));
    const cands=new Set([minutesToTime(startMin)]);
    for (const ts of getTimeSlots()){ if (timeToMinutes(ts)>=startMin) cands.add(ts); }
    const arr=[...cands].sort((a,b)=>timeToMinutes(a)-timeToMinutes(b));
    for (const tm of arr){
      if (res.length>=n) break;
      const s=timeToMinutes(tm);
      if (s+30>closingMinutes()) continue;
      if (!isSlotAvailable(mid,date,tm,addMinutes(tm,30))) continue;
      res.push(tm);
    }
    return res;
  };

  const cleanupOldBookings = async () => {
    const now=new Date(); const keys=[];
    for (const [key,b] of Object.entries(bookings)){
      const[y,m,d]=b.date.split('-').map(Number);
      const[eh,em]=b.endTime.split(':').map(Number);
      const end=new Date(y,m-1,d,eh,em); end.setHours(end.getHours()+config.cleanupDelayHours);
      if (now>end) keys.push(key);
    }
    for (const key of keys){ try{ await remove(ref(db,`bookings/${key}`)); }catch(e){console.error(e);} }
  };

  let pinCtx = null;
  function openPinModal(nameKey, expectedHash, ln, fn, cb){
    if (!expectedHash){ alert(t('pinNotSet')); return false; }
    pinCtx = {nameKey, expectedHash, ln, fn, cb};
    document.getElementById('pinWho').textContent = t('pinWho',{name:`${ln} ${fn}`});

    setTimeout(()=>document.getElementById('pinInput').focus(),100);

  }
  window.cancelPin = ()=>{ pinCtx=null; closeModal('pinModal'); };
  window.submitPin = async ()=>{
    if (!pinCtx) return;
    const val = document.getElementById('pinInput').value.trim();
    const errEl = document.getElementById('pinError');
    if (!/^\d{6}$/.test(val)){ errEl.textContent=t('pinLen'); return; }
    let hash;
    try { hash = await sha256(val); }
    catch { errEl.textContent=t('insecureCtx'); return; }
    if (hash !== pinCtx.expectedHash){ errEl.textContent=t('pinWrong'); return; }
    setSession(pinCtx.nameKey, pinCtx.expectedHash);
    setLastIdentity(pinCtx.nameKey, pinCtx.ln, pinCtx.fn);
    const cb = pinCtx.cb; pinCtx=null;
    closeModal('pinModal');
    showToast(t('pinOk'));
    if (cb) cb();
    render();
  };
  window.logoutVer = ()=>{ clearSession(); clearLastIdentity(); render(); showToast(t('logoutVer')); };

  const renderQuickSlots = (mid)=>{
    const box=document.getElementById('quickSlots');
    const slots=getNearestFreeSlots(mid, selectedDate, 4);
    if (!slots.length){ box.innerHTML=`<div class="free-window empty" style="grid-column:1/-1">${t('noFreeToday')}</div>`; return; }
    box.innerHTML = slots.map((tm,i)=>{
      const isNow = i===0;
      return `<button class="quick-btn ${isNow?'now':''}" data-qs-time="${escapeHtml(tm)}">${isNow?`<small>${t('nowLabel')}</small>`:''}${tm}</button>`;
    }).join('');
  };

  const updateBookingUI = () => {
    const mid = pendingBooking?.machineId;
    const time=document.getElementById('bookTime').value;
    const summary=document.getElementById('bookingSummary');
    const submitBtn=document.getElementById('bookSubmitBtn');
    const ln=document.getElementById('bookLastName').value.trim();
    const fn=document.getElementById('bookFirstName').value.trim();
    const fw=document.getElementById('freeWindow');
    if (mid) renderQuickSlots(mid);
    if (!time){ summary.style.display='none'; fw.style.display='none'; submitBtn.disabled=false; return; }
    const s=timeToMinutes(time);
    const endMin=s+selectedDuration;
    const exceedsClose = endMin>closingMinutes();
    const beforeOpen = s<openingMinutes();
    const occupied = !isSlotAvailable(mid, selectedDate, time, addMinutes(time,30));
    const maxFit = occupied ? 0 : getMaxFit(mid, selectedDate, time);
    const until = getFreeUntil(mid, selectedDate, time);
    fw.style.display='block';
    if (beforeOpen){ fw.className='free-window bad'; fw.textContent=`⛔ ${t('errTime',{advance:config.maxAdvanceHours})}`; }
    else if (occupied){ fw.className='free-window bad'; fw.textContent=`⛔ ${t('errBusy')}`; }
    else if (exceedsClose){ fw.className='free-window bad'; fw.textContent=t('closingWarning',{end:minutesToTime(endMin),close:config.closeHour}); }
    else { fw.className='free-window'; fw.textContent=t('freeUntil',{until, max:maxFit}); }
    summary.style.display='block';
    if (exceedsClose || beforeOpen || occupied){
      summary.className='summary-box bad';
      summary.textContent = occupied ? t('errBusy') : t('closingWarning',{end:minutesToTime(endMin),close:config.closeHour});
      submitBtn.disabled=true;
    } else if (selectedDuration>maxFit){
      summary.className='summary-box bad'; summary.textContent=t('tooLong',{max:maxFit}); submitBtn.disabled=true;
    } else {
      summary.className='summary-box ok';
      summary.textContent=`${time} — ${minutesToTime(endMin)} • ${selectedDuration} ${t('min')}`;
      submitBtn.disabled=false;
    }
    const limitInfo=document.getElementById('weeklyLimitInfo');
    if (ln&&fn){
      const nk=nameKey(ln,fn);
      const used=getWeeklyUsage(nk);
      const remaining=Math.max(0,config.weeklyLimit-used);
      limitInfo.style.display='block';
      if (remaining<selectedDuration){
        limitInfo.style.background='var(--busy-bg)'; limitInfo.style.color='var(--busy-text)'; limitInfo.style.borderColor='var(--busy-border)';
        limitInfo.textContent=t('weeklyLimitExceeded'); submitBtn.disabled=true;
      } else {
        limitInfo.style.background='var(--limit-bg)'; limitInfo.style.color='var(--limit-text)'; limitInfo.style.borderColor='var(--limit-border)';
        limitInfo.textContent=t('weeklyLimit',{remaining,weekly:config.weeklyLimit});
      }
    } else limitInfo.style.display='none';
  };

  // ★ ПРАВКА 3: убираем дубль расчёта, время по умолчанию = от выбранной даты
  window.openBookModal = (machineId,time)=>{
    const st=machineStatuses[machineId];
    const m=machinesList.find(x=>x.id===machineId);
    if (!m||!m.active||(st&&st.status!=='working')){ alert(t('brokenNotice')); return; }
    const defTime = time || getDefaultStartTime(selectedDate);
    pendingBooking={machineId,time:defTime};
    document.getElementById('modalMachineName').textContent=`🧺 ${escapeHtml(m.name)}`;
    const ti=document.getElementById('bookTime');
    ti.min=`${String(config.openHour).padStart(2,'0')}:00`;
    ti.max=`${String(config.closeHour-1).padStart(2,'0')}:30`;
    ti.value=defTime;
    ti.onchange=()=>{ pendingBooking.time=ti.value; updateBookingUI(); };
    document.getElementById('bookLastName').value=localStorage.getItem('laundry_ln')||'';
    document.getElementById('bookFirstName').value=localStorage.getItem('laundry_fn')||'';
    document.getElementById('bookLastName').oninput=updateBookingUI;
    document.getElementById('bookFirstName').oninput=updateBookingUI;
    document.querySelectorAll('.duration-btn').forEach(b=>b.classList.toggle('active',parseInt(b.textContent)===selectedDuration));
    updateBookingUI();
    document.getElementById('bookModal').classList.add('active');
  };

  window.confirmBooking = async ()=>{
    const ln=document.getElementById('bookLastName').value.trim();
    const fn=document.getElementById('bookFirstName').value.trim();
    const time=document.getElementById('bookTime').value;
    if (!ln||!fn) return alert(t('errName'));
    if (!time) return alert(t('errTime',{advance:config.maxAdvanceHours}));
    if (!isUserAllowed(ln,fn)) return alert(t('errNotAllowed'));
    if (!isSlotAllowed(selectedDate,time)) return alert(t('errTime',{advance:config.maxAdvanceHours}));
    if (!canFinishByClosing(time,selectedDuration)) return alert(t('errClosing',{close:config.closeHour}));
    const endTime=addMinutes(time,selectedDuration);
    if (!isSlotAvailable(pendingBooking.machineId,selectedDate,time,endTime)) return alert(t('errBusy'));

    const nk=nameKey(ln,fn);
    if (hasActiveSession(nk)) return doCreateBooking(nk,ln,fn,time,endTime);
    const u=findAllowedByNameKey(nk);
    openPinModal(nk, u&&u.pinHash, ln, fn, ()=>doCreateBooking(nk,ln,fn,time,endTime));
  };

  async function doCreateBooking(nk,ln,fn,time,endTime){
    const weekly=getWeeklyUsage(nk);
    if (weekly+selectedDuration>config.weeklyLimit) return alert(t('errWeeklyLimit',{used:weekly,weekly:config.weeklyLimit,weeklyH:+(config.weeklyLimit/60).toFixed(1)}));
    const dayB=Object.values(bookings).filter(b=>b.date===selectedDate&&bookingNameKey(b)===nk);
    const uniq=new Set(dayB.map(b=>b.machineId)).size;
    const already=dayB.some(b=>b.machineId===pendingBooking.machineId);
    if (uniq>=config.dailyMachinesLimit&&!already) return alert(t('errLimit1',{dailyMachines:config.dailyMachinesLimit}));
    const mTot=dayB.filter(b=>b.machineId===pendingBooking.machineId).reduce((s,b)=>s+(b.duration||0),0);
    if (mTot+selectedDuration>config.perMachineDailyLimit) return alert(t('errLimit2',{perMachineH:+(config.perMachineDailyLimit/60).toFixed(1)}));

    const key=`${pendingBooking.machineId}|${selectedDate}|${time}`;
    const newBooking={machineId:pendingBooking.machineId,lastName:ln,firstName:fn,nameKey:nk,date:selectedDate,startTime:time,endTime,duration:selectedDuration,createdAt:Date.now()};
    try{
      const res = await runTransaction(ref(db,`bookings/${key}`), (cur)=>{ if (cur!==null) return; return newBooking; });
      if (!res.committed) return alert(t('errBusy'));
      localStorage.setItem('laundry_ln',ln); localStorage.setItem('laundry_fn',fn);
      setLastIdentity(nk,ln,fn);
      closeModal('bookModal');
    }catch(e){alert('Error: '+e.message);}
  }

  const doCancel = async (key)=>{
    const b=bookings[key]; if(!b) return;
    if (isAdmin){ if(!confirm(t('confirmCancel')))return; try{ await remove(ref(db,`bookings/${key}`)); }catch(e){alert('Error: '+e.message);} return; }
    const li=getLastIdentity();
    const nk=bookingNameKey(b);
    if (!li || li.nameKey!==nk) return alert(t('errCancel'));
    if (hasActiveSession(nk)){
      if(!confirm(t('confirmCancel')))return;
      try{ await remove(ref(db,`bookings/${key}`)); }catch(e){alert('Error: '+e.message);}
      return;
    }
    const u=findAllowedByNameKey(nk);
    openPinModal(nk, u&&u.pinHash, b.lastName, b.firstName, async ()=>{
      if(!confirm(t('confirmCancel')))return;
      try{ await remove(ref(db,`bookings/${key}`)); }catch(e){alert('Error: '+e.message);}
    });
  };

  window.setMachineStatus = async (mid,status,comment)=>{

    catch(e){alert('Error: '+e.message);}

  window.saveSetting = (field,value)=>{ const num=parseInt(value,10); if(!isNaN(num)) config[field]=num; };
  const validateConfig = (c) => {
    const errs=[];
    if (!(c.openHour>=0&&c.openHour<=23)) errs.push('Открытие: 0–23');
    if (!(c.closeHour>=1&&c.closeHour<=24)) errs.push('Закрытие: 1–24');
    if (c.openHour>=c.closeHour) errs.push('Открытие < закрытия');
    const maxMachines=Math.max(1,machinesList.filter(m=>m.active).length);
    if (!(c.dailyMachinesLimit>=1&&c.dailyMachinesLimit<=maxMachines)) errs.push(`Машинки в день: 1–${maxMachines}`);
    if (!(c.perMachineDailyLimit>=30&&c.perMachineDailyLimit<=1440)) errs.push('Минут на машинку: 30–1440');
    if (!(c.weeklyLimit>=30&&c.weeklyLimit<=10080)) errs.push('Недельный: 30–10080');
    if (!(c.maxAdvanceHours>=1&&c.maxAdvanceHours<=168)) errs.push('Вперёд: 1–168');
    if (!(c.cleanupDelayHours>=0&&c.cleanupDelayHours<=168)) errs.push('Автоочистка: 0–168');
    return errs;
  };
  window.saveSettings = async ()=>{

  window.usersSearchInput = (v)=>{ usersSearch=v; render(); };
  window.usersLetterSet = (l)=>{ usersLetter=(usersLetter===l?'':l); render(); };
  window.usersSortSet = (v)=>{ usersSort=v; render(); };
  window.addAllowedUser = async ()=>{
    const ln=document.getElementById('newULastName').value.trim();
    const fn=document.getElementById('newUFirstName').value.trim();
    const pin=document.getElementById('newUPin').value.trim();
    if (!ln||!fn) return;
    if (!/^\d{6}$/.test(pin)) return alert(t('pinLen'));
    if (isWeakPin(pin)) return alert(t('pinWeak'));
    let hash; try{ hash=await sha256(pin); }catch{ return alert(t('insecureCtx')); }
    if (findDuplicatePinHash(null, hash)) return alert(t('pinDup'));
    try{
      await push(ref(db,'allowedUsers'),{fullName:`${ln} ${fn}`,lastName:ln,firstName:fn,pinHash:hash,addedAt:Date.now()});
      document.getElementById('newULastName').value=''; document.getElementById('newUFirstName').value=''; document.getElementById('newUPin').value='';
      showToast(t('added'));
    }catch(e){alert('Error: '+e.message);}
  };
  window.removeAllowedUser = async (uid)=>{
    if (!confirm(t('confirmCancel'))) return;
    try{ await remove(ref(db,`allowedUsers/${uid}`)); showToast(t('removed')); }catch(e){alert('Error: '+e.message);}
  };
  let adminPinUid=null;
  window.adminResetPin = (uid, ln, fn)=>{
    adminPinUid=uid;
    document.getElementById('adminPinWho').textContent=`${ln} ${fn}`;
    document.getElementById('adminPinInput').value='';
    document.getElementById('adminPinError').textContent='';
    document.getElementById('adminPinModal').classList.add('active');
    setTimeout(()=>document.getElementById('adminPinInput').focus(),100);
  };
  window.submitAdminPin = async ()=>{
    if (!adminPinUid) return;
    const val=document.getElementById('adminPinInput').value.trim();
    const errEl=document.getElementById('adminPinError');
    if (!/^\d{6}$/.test(val)){ errEl.textContent=t('pinLen'); return; }
    if (isWeakPin(val)){ errEl.textContent=t('pinWeak'); return; }
    let hash; try{ hash=await sha256(val); }catch{ errEl.textContent=t('insecureCtx'); return; }
    const dup=findDuplicatePinHash(adminPinUid, hash);
    if (dup){ errEl.textContent=t('pinDup'); return; }
    try{
      await set(ref(db,`allowedUsers/${adminPinUid}/pinHash`), hash);
      adminPinUid=null; closeModal('adminPinModal'); showToast(t('pinSaved'));
    }catch(e){alert('Error: '+e.message);}
  };

  const RU_ALPHA='АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ'.split('');
  const firstLetter = (s)=> (s||'?').trim().charAt(0).toUpperCase();
  const collator = new Intl.Collator(['ru','en','zh'],{sensitivity:'base'});
  const buildUserList = () => {
    let arr=Object.entries(allowedUsers).map(([id,u])=>({id,...u}));
    const q=usersSearch.trim().toLowerCase();
    if (q) arr=arr.filter(u=>(u.fullName||'').toLowerCase().includes(q));
    else if (usersLetter) arr=arr.filter(u=>firstLetter(u.lastName)===usersLetter);
    if (usersSort==='lastNameAsc') arr.sort((a,b)=>collator.compare(a.lastName||'',b.lastName||''));
    else if (usersSort==='lastNameDesc') arr.sort((a,b)=>collator.compare(b.lastName||'',a.lastName||''));
    else arr.sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));
    return arr;
  };
  const lastActivityByNameKey = (nk)=>{
    let mx=0; for (const b of Object.values(bookings)) if (bookingNameKey(b)===nk) mx=Math.max(mx,b.createdAt||0);
    return mx;
  };

  const renderTimelineBar = (machineId, mb)=>{
    const open=openingMinutes(), close=closingMinutes(), span=close-open;
    const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
    const showNow = selectedDate===new Date().toISOString().split('T')[0] && nowMin>=open && nowMin<=close;
    const nowPct = ((nowMin-open)/span*100).toFixed(2);
    let segs='';
    mb.forEach(b=>{
      const s=Math.max(open,timeToMinutes(b.startTime)), e=Math.min(close,timeToMinutes(b.endTime));
      if (e<=s) return;
      const left=((s-open)/span*100).toFixed(2), width=((e-s)/span*100).toFixed(2);
      const st=getBookingStatus(b);
      const label = width>8 ? escapeHtml(b.lastName) : '';
      segs+=`<div class="tlbar-seg s-${st}" style="left:${left}%;width:${width}%" title="${escapeHtml(b.lastName)} ${escapeHtml(b.firstName)} • ${b.startTime}–${b.endTime}">${label}</div>`;
    });
    const nowLine = showNow ? `<div class="tlbar-now" style="left:${nowPct}%"></div>` : '';
    return `<div class="tlbar-wrap">
      <div class="tlbar-labels"><span>${String(config.openHour).padStart(2,'0')}:00</span><span>${String(config.closeHour).padStart(2,'0')}:00</span></div>
      <div class="tlbar">${segs}${nowLine}</div>
    </div>`;
  };

  const renderVerifiedBanner = ()=>{
    const li=getLastIdentity(); if(!li) return '';
    const active=hasActiveSession(li.nameKey);
    const who=`${escapeHtml(li.lastName)} ${escapeHtml(li.firstName)}`;
    if (active) return `<div class="verified-banner">✅ ${t('verifiedAs')} <span class="vb-who">${who}</span><button onclick="window.logoutVer()">${t('logoutVer')}</button></div>`;
    return `<div class="verified-banner" style="background:var(--warn-bg);color:var(--warn-text);border-color:var(--warn-border)">⏳ ${who} — ${t('pinSessionExpired')}<button onclick="window.logoutVer()">${t('logoutVer')}</button></div>`;
  };

  const renderNextSlotBadge = ()=>{
    const li=getLastIdentity(); if(!li) return '';
    const mine=Object.values(bookings).filter(b=>bookingNameKey(b)===li.nameKey && getBookingStatus(b)!=='past');
    if (!mine.length) return '';
    mine.sort((a,b)=>{ const da=new Date(a.date+'T'+a.startTime), db=new Date(b.date+'T'+b.startTime); return da-db; });
    const nb=mine[0];
    const m=machinesList.find(x=>x.id===nb.machineId);
    const st=getBookingStatus(nb);
    const sub = st==='active' ? t('nextSlotNow') : t('nextSlotIn',{n:minutesLeft(nb)});
    return `<div class="next-slot">
      <span class="ns-icon">🫧</span>
      <div>
        <div>${t('nextSlot')}: ${escapeHtml(m?m.name:'')} • ${nb.startTime}–${nb.endTime}</div>
        <div class="ns-sub">${escapeHtml(nb.lastName)} ${escapeHtml(nb.firstName)} — ${sub}</div>
      </div>
    </div>`;
  };

  const isMyBooking = (b)=>{ const li=getLastIdentity(); return !!li && bookingNameKey(b)===li.nameKey; };

  const render = ()=>{
    const appEl=document.getElementById('app');
    const allBookings=Object.entries(bookings).map(([key,b])=>({key,...b}));
    let html=`
      <div class="date-selector">
        <label>${t('date')}</label>
        <input type="date" value="${selectedDate}" min="${new Date().toISOString().split('T')[0]}" onchange="window.changeDate(this.value)">
        <span style="font-size:14px;color:var(--text-secondary)">${formatDate(selectedDate)}</span>
      </div>
      <div class="rules-hint">${rulesText()}</div>`;

    if (currentView==='settings' && isAdmin){ appEl.innerHTML=html+renderSettings(); return; }
    if (currentView==='list' && isAdmin){ appEl.innerHTML=html+renderList(); return; }

    html += renderVerifiedBanner();
    html += renderNextSlotBadge();

    if (currentView==='machines'){
      html+=`<div class="machines-list">`;
      machinesList.filter(m=>m.active).forEach(machine=>{
        const st=machineStatuses[machine.id];
        const isBroken=st&&st.status!=='working';
        const mb=allBookings.filter(b=>b.machineId===machine.id&&b.date===selectedDate)
          .sort((a,b)=>timeToMinutes(a.startTime)-timeToMinutes(b.startTime));
        html+=`<div class="machine-card ${isBroken?'broken':''}">
          <div class="card-header"><div class="machine-info"><span class="machine-icon">🧺</span>
            <div><div class="machine-name">${escapeHtml(machine.name)}</div><div class="machine-floor">${escapeHtml(machine.floor)}</div></div></div>
            <span class="status-badge ${isBroken?'broken':'working'}">${isBroken?'🔧 '+t(st.status):'✓ '+t('working')}</span></div>`;
        if (isBroken) html+=`<div class="broken-notice"><strong>${t('brokenNotice')}</strong>${st.comment?`<div>${escapeHtml(st.comment)}</div>`:''}</div>`;
        html+= renderTimelineBar(machine.id, mb);
        html+=`<div class="timeline"><div class="timeline-title">${t('scheduleTitle')}</div>`;
        if (mb.length===0) html+=`<div style="text-align:center;color:var(--text-secondary);padding:10px;font-style:italic">${t('allDayFree')}</div>`;
        else mb.forEach(b=>{
          const bs=getBookingStatus(b); const mine=isMyBooking(b);
          const txt=bs==='active'?t('active'):(bs==='past'?t('past'):t('future'));
          const cd = bs==='active' ? `<span class="tl-countdown">${t('remaining',{n:minutesLeft(b)})}</span>` : '';
          html+=`<div class="timeline-item status-${bs}">
            <span class="tl-time">${b.startTime} – ${b.endTime}</span>
            <span class="tl-name">${escapeHtml(b.lastName)} ${escapeHtml(b.firstName.charAt(0))}.</span>
            ${cd}
            <span class="tl-status">${txt}</span>
            ${(isAdmin||(mine&&bs!=='past'))?`<button class="btn-cancel-small js-cancel" data-cancel-key="${escapeHtml(b.key)}">${t('cancel')}</button>`:''}
          </div>`;
        });
        html+=`</div><button class="btn-book" onclick="window.openBookModal(${machine.id})" ${isBroken?'disabled':''}>📅 ${t('book')}</button></div>`;
      });
      html+=`</div>`;
    } else {
      const slots=getTimeSlots();
      html+=`<div class="schedule-container"><div class="schedule-scroll"><table class="schedule-table"><thead><tr>
        <th class="time-head" style="text-align:right;padding-right:8px">${t('startTime')}</th>`;
      machinesList.filter(m=>m.active).forEach(m=>html+=`<th><span class="th-icon">🧺</span>${escapeHtml(m.name.replace(/^.*?№/,'№'))}</th>`);
      html+=`</tr></thead><tbody>`;
      slots.forEach(time=>{
        html+=`<tr><td class="time-cell">${time}</td>`;
        machinesList.filter(m=>m.active).forEach(machine=>{
          const st=machineStatuses[machine.id];
          if (st&&st.status!=='working'){ html+=`<td><button class="slot-btn broken" disabled>🔧</button></td>`; return; }
          const booking=allBookings.find(b=>b.machineId===machine.id&&b.date===selectedDate&&
            timeToMinutes(time)>=timeToMinutes(b.startTime)&&timeToMinutes(time)<timeToMinutes(b.endTime));
          if (booking){
            const bs=getBookingStatus(booking); const mine=isMyBooking(booking);
            const canCancel = isAdmin||(mine&&bs!=='past');
            html+=`<td><button class="slot-btn booked-${bs}${canCancel?' js-cancel':''}" ${canCancel?`data-cancel-key="${escapeHtml(booking.key)}"`:''} title="${escapeHtml(booking.lastName)} ${escapeHtml(booking.firstName)} • ${booking.startTime}–${booking.endTime}"><span>${escapeHtml(booking.lastName)}</span></button></td>`;
          } else {
            const allowed=isSlotAllowed(selectedDate,time)&&canFinishByClosing(time,30);
            html+=allowed
              ?`<td><button class="slot-btn free" onclick="window.openBookModal(${machine.id},'${time}')">${t('free')}</button></td>`
              :`<td><button class="slot-btn disabled" disabled>—</button></td>`;
          }
        });
        html+=`</tr>`;
      });
      html+=`</tbody></table></div></div>`;
    }
    appEl.innerHTML=html;
  };

  const renderSettings = ()=>{
    let mm='';
    machinesList.forEach(m=>{
      mm+=`<div class="machine-mgmt-row">
        <span class="mm-id">#${m.id}</span>
        <input type="text" value="${escapeHtml(m.name)}" oninput="window.updateMachineField(${m.id},'name',this.value)" placeholder="${t('machineNamePh')}">
        <input type="text" value="${escapeHtml(m.floor)}" oninput="window.updateMachineField(${m.id},'floor',this.value)" placeholder="${t('machineFloorPh')}">
        <button class="mm-toggle ${m.active?'on':''}" onclick="window.toggleMachineActive(${m.id})">${m.active?t('enabled'):t('disabled')}</button>
        <button class="mm-del js-del-machine" data-machine-id="${m.id}">${t('delMachine')}</button>
        <button class="btn-mini" onclick="window.saveMachine(${m.id})">💾</button>
      </div>`;
    });
    return `<div class="settings-panel">
      <h3>${t('settingsTitle')}</h3>
      <h4>${t('machinesTitle')}</h4>
      <div class="machine-mgmt">${mm}</div>
      <div class="add-machine-bar">
        <input type="text" id="newMachineName" placeholder="${t('machineNamePh')}">
        <input type="text" id="newMachineFloor" placeholder="${t('machineFloorPh')}">
        <button class="btn-add-user" onclick="window.addMachine()">${t('addMachine')}</button>
      </div>
      <h4 style="margin-top:24px">${t('setLimits')}</h4>
      <div class="settings-grid">
        <div class="setting-item"><label>${t('setOpen')}</label>
          <input type="number" min="0" max="23" value="${config.openHour}" onchange="window.saveSetting('openHour',this.value)"><div class="setting-hint">0–23</div></div>
        <div class="setting-item"><label>${t('setClose')}</label>
          <input type="number" min="1" max="24" value="${config.closeHour}" onchange="window.saveSetting('closeHour',this.value)"><div class="setting-hint">1–24</div></div>
        <div class="setting-item"><label>${t('setDailyMachines')}</label>
          <input type="number" min="1" max="${Math.max(1,machinesList.filter(m=>m.active).length)}" value="${config.dailyMachinesLimit}" onchange="window.saveSetting('dailyMachinesLimit',this.value)"><div class="setting-hint">1–${Math.max(1,machinesList.filter(m=>m.active).length)}</div></div>
        <div class="setting-item"><label>${t('setPerMachine')}</label>
          <input type="number" min="30" max="1440" step="30" value="${config.perMachineDailyLimit}" onchange="window.saveSetting('perMachineDailyLimit',this.value)"><div class="setting-hint">≈ ${(config.perMachineDailyLimit/60).toFixed(1)} ч</div></div>
        <div class="setting-item"><label>${t('setWeekly')}</label>
          <input type="number" min="30" max="10080" step="30" value="${config.weeklyLimit}" onchange="window.saveSetting('weeklyLimit',this.value)"><div class="setting-hint">≈ ${(config.weeklyLimit/60).toFixed(1)} ч</div></div>
        <div class="setting-item"><label>${t('setAdvance')}</label>
          <input type="number" min="1" max="168" value="${config.maxAdvanceHours}" onchange="window.saveSetting('maxAdvanceHours',this.value)"><div class="setting-hint">1–168 ч</div></div>
        <div class="setting-item"><label>${t('setCleanup')}</label>
          <input type="number" min="0" max="168" value="${config.cleanupDelayHours}" onchange="window.saveSetting('cleanupDelayHours',this.value)"><div class="setting-hint">0–168 ч</div></div>
      </div>
      <div class="settings-actions">
        <button class="btn-save" onclick="window.saveSettings()">💾 ${t('save')}</button>
        <button class="btn-reset" onclick="window.resetSettings()">↩️ ${t('resetDefaults')}</button>
      </div>
    </div>`;
  };

  const renderList = ()=>{
    const total=Object.keys(allowedUsers).length;
    const filtered=buildUserList();
    const lettersPresent=new Set(Object.values(allowedUsers).map(u=>firstLetter(u.lastName)));
    let alpha=`<button class="alpha-btn ${usersLetter===''?'active':''}" onclick="window.usersLetterSet('')">${t('all')}</button>`;
    RU_ALPHA.forEach(L=>{
      const has=lettersPresent.has(L);
      alpha+=`<button class="alpha-btn ${usersLetter===L?'active':''} ${has?'':'empty'}" ${has?`onclick="window.usersLetterSet('${L}')"`:'disabled'}>${L}</button>`;
    });
    let rows='';
    if (filtered.length===0) rows=`<div class="empty-list">${total===0?t('noUsers'):t('noMatch')}</div>`;
    else {
      let curLetter=null;
      filtered.forEach(u=>{
        const L=firstLetter(u.lastName);
        if (usersSort==='lastNameAsc' && L!==curLetter){ curLetter=L; rows+=`<div class="letter-header">${L}</div>`; }
        const added=u.addedAt?new Date(u.addedAt).toLocaleDateString(currentLang==='ru'?'ru-RU':currentLang==='zh'?'zh-CN':'en-US'):'';
        const nk=nameKey(u.lastName,u.firstName);
        const la=lastActivityByNameKey(nk);
        const laStr=la?new Date(la).toLocaleDateString(currentLang==='ru'?'ru-RU':currentLang==='zh'?'zh-CN':'en-US'):'';
        const hasPin=!!u.pinHash;
        rows+=`<div class="user-row">
          <div><div class="user-name">${escapeHtml(u.lastName)} ${escapeHtml(u.firstName)}
            <span class="bind-chip ${hasPin?'ok':'warn'}">${hasPin?t('pinSet'):t('pinMissing')}</span></div>
          <div class="user-meta">${added?`${t('addedOn')} ${added}`:''}${laStr?` · ${t('lastSeen')} ${laStr}`:''}</div></div>
          <div class="user-actions">
            <button class="btn-mini js-admin-pin" data-uid="${escapeHtml(u.id)}" data-ln="${escapeHtml(u.lastName)}" data-fn="${escapeHtml(u.firstName)}">${t('resetPin')}</button>
            <button class="btn-mini danger js-remove-user" data-uid="${escapeHtml(u.id)}">${t('cancel')}</button>
          </div>
        </div>`;
      });
    }
    return `<div class="list-toolbar">
        <div class="list-search-row">
          <input class="list-search" type="text" placeholder="${t('search')}" value="${escapeHtml(usersSearch)}" oninput="window.usersSearchInput(this.value)">
          <select class="list-sort" onchange="window.usersSortSet(this.value)">
            <option value="lastNameAsc" ${usersSort==='lastNameAsc'?'selected':''}>${t('sortLasc')}</option>
            <option value="lastNameDesc" ${usersSort==='lastNameDesc'?'selected':''}>${t('sortLdesc')}</option>
            <option value="addedAt" ${usersSort==='addedAt'?'selected':''}>${t('sortAdded')}</option>
          </select>
        </div>
        <div class="alpha-index">${alpha}</div>
        <div class="list-stats">${t('shownOf',{shown:filtered.length,total})}</div>
        <div class="add-user-bar">
          <input type="text" id="newULastName" placeholder="${t('lastName')}">
          <input type="text" id="newUFirstName" placeholder="${t('firstName')}">
          <div class="pin-with-gen">
            <input type="tel" id="newUPin" inputmode="numeric" maxlength="6" placeholder="PIN 6">
            <button type="button" class="btn-gen" title="Случайный PIN" onclick="window.genPinInto('newUPin')">🎲</button>
          </div>
          <button class="btn-add-user" onclick="window.addAllowedUser()">${t('addNew')}</button>
        </div>
      </div>
      <div class="users-scroll">${rows}</div>`;
  };

  document.addEventListener('click', (e)=>{
    const qs=e.target.closest('[data-qs-time]');
    if (qs){ const tm=qs.getAttribute('data-qs-time'); document.getElementById('bookTime').value=tm; pendingBooking.time=tm; updateBookingUI(); return; }
    const cancel=e.target.closest('[data-cancel-key]');
    if (cancel){ doCancel(cancel.getAttribute('data-cancel-key')); return; }
    const ap=e.target.closest('[data-ln]');
    if (ap && ap.classList.contains('js-admin-pin')){ window.adminResetPin(ap.getAttribute('data-uid'), ap.getAttribute('data-ln'), ap.getAttribute('data-fn')); return; }
    const rmUser=e.target.closest('[data-uid]');
    if (rmUser && rmUser.classList.contains('js-remove-user')){ window.removeAllowedUser(rmUser.getAttribute('data-uid')); return; }
    const dm=e.target.closest('[data-machine-id]');
    if (dm){ window.deleteMachine(Number(dm.getAttribute('data-machine-id'))); return; }
  });
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ closeModal('bookModal'); closeModal('adminLoginModal'); closeModal('pinModal'); closeModal('adminPinModal'); } });
  document.getElementById('pinInput').addEventListener('keydown',(e)=>{ if(e.key==='Enter') submitPin(); });
  document.getElementById('adminPinInput').addEventListener('keydown',(e)=>{ if(e.key==='Enter') submitAdminPin(); });

  function applyTranslations(){
    document.getElementById('appTitle').textContent=t('title');
    document.getElementById('appSubtitle').textContent=t('subtitle');
    document.querySelector('.t-machines').textContent=t('machines');
    document.querySelector('.t-schedule').textContent=t('schedule');
    document.querySelector('.t-list').textContent=t('list');
    document.querySelector('.t-settings').textContent=t('settings');
    document.querySelector('.t-admin').textContent=t('admin');
    document.querySelector('.t-quickTitle').textContent=t('quickTitle');
    document.querySelector('.t-startTime').textContent=t('startTime');
    document.querySelector('.t-duration').textContent=t('duration');
    document.querySelector('.t-lastName').textContent=t('lastName');
    document.querySelector('.t-firstName').textContent=t('firstName');
    document.querySelector('.t-book').textContent=t('book');
    document.querySelector('.t-pinTitle').textContent=t('pinTitle');
    document.querySelector('.t-pinLabel').textContent=t('pinLabel');
    document.querySelector('.t-pinVerify').textContent=t('pinVerify');
    document.querySelector('.t-adminPinTitle').textContent=t('adminPinTitle');
    document.querySelector('.t-newPin').textContent=t('newPin');
    document.querySelector('.t-savePin').textContent=t('savePin');
    document.querySelector('.t-adminLogin').textContent=t('adminLogin');
    document.querySelector('.t-password').textContent=t('password');
    document.querySelector('.t-login').textContent=t('login');
    document.querySelectorAll('.t-min').forEach(el=>el.textContent=t('min'));
    render();
  }
  window.setLanguage=(lang)=>{ currentLang=lang; localStorage.setItem('laundry_lang',lang); applyTranslations(); };

  onValue(settingsRef,(s)=>{ const v=s.val(); if (v) config={...DEFAULT_CONFIG,...v}; render(); });
  onValue(bookingsRef,(s)=>{ bookings=s.val()||{}; cleanupOldBookings(); render(); });
  onValue(machineStatusRef,(s)=>{ machineStatuses=s.val()||{}; render(); });
  onValue(allowedUsersRef,(s)=>{ allowedUsers=s.val()||{}; render(); });
  onValue(machinesRef,(s)=>{
    const v=s.val();
    if (!v || Object.keys(v).length===0){
      if (!machinesLoaded){
        machinesLoaded=true;
        const def={};
        for (let i=1;i<=5;i++) def[i]={name:`Стиралка №${i}`, floor:`${Math.ceil(i/2)} этаж`, active:true};
        set(machinesRef, def).catch(e=>console.error(e));
      }
      return;
    }
    machinesList=Object.entries(v).map(([id,m])=>({id:Number(id),name:m.name||'',floor:m.floor||'',active:m.active!==false}));
    machinesList.sort((a,b)=>a.id-b.id);
    machinesLoaded=true;
    render();
  });

  setInterval(cleanupOldBookings,5*60*1000);
  setInterval(render,60000);
  applyAdminVisibility();
  applyTranslations();
</script>
</body>
</html>
